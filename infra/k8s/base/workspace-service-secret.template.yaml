# ШАБЛОН, не входит в kustomization и не содержит значений.
# Secret создаёт оператор или внешний менеджер секретов, значения в git не коммитятся:
#   kubectl create secret generic workspace-service-secrets \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=...
# Deployment ссылается на ключи DB_USERNAME и DB_PASSWORD этого Secret.
apiVersion: v1
kind: Secret
metadata:
  name: workspace-service-secrets
  labels:
    app.kubernetes.io/name: workspace-service
type: Opaque
stringData:
  DB_USERNAME: ""   # задать вне git
  DB_PASSWORD: ""   # задать вне git
