apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-service
  labels:
    app.kubernetes.io/name: workspace-service
    app.kubernetes.io/part-of: odysseus
data:
  SERVER_PORT: "8081"
  # Допущения: адреса внутри кластера, поправить оверлеем под реальное окружение.
  DB_URL: "jdbc:postgresql://postgres:5432/workspace_db"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KEYCLOAK_ISSUER_URI: "http://keycloak:8180/realms/odysseus"
  KEYCLOAK_AUDIENCE: "odysseus-api"
  # Отдельные probes liveness и readiness в actuator
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
