apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace задаётся оверлеем или при применении (kubectl apply -n). Secret не входит: см. workspace-service-secret.template.yaml.
resources:
  - workspace-service-configmap.yaml
  - workspace-service-deployment.yaml
  - workspace-service-service.yaml
# Образ: допущение, registry не настроен. Оверлей подставляет реальный адрес и тег (images: name/newName/newTag).
images:
  - name: odysseus/workspace-service
    newTag: latest
