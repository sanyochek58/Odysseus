name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  workspace-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка и юнит-тесты
        run: make build SVC=workspace-service
      - name: Интеграционные тесты
        run: make it SVC=workspace-service
