name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Определение изменённых сервисов
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.diff.outputs.services }}
      libs: ${{ steps.diff.outputs.libs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Изменённые сервисы
        run: |
          echo "services=$(make changed-services BASE=origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"
          echo "libs=$(make changed-libs BASE=origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

  lib-tests:
    name: Юнит-тесты библиотеки (${{ matrix.lib }})
    needs: changes
    if: needs.changes.outputs.libs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.changes.outputs.libs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: make test-lib LIB=${{ matrix.lib }}

  build:
    name: Сборка и юнит-тесты (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: make build SVC=${{ matrix.service }}

  integration-tests:
    name: Интеграционные тесты, Testcontainers (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Docker на ubuntu-latest уже есть, Testcontainers использует его напрямую
      - run: make it SVC=${{ matrix.service }}

  docker-image:
    name: Docker-образ (${{ matrix.service }})
    needs: [changes, build]
    # Образ собирается только если есть Dockerfile; push в registry не настроен (нет данных)
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка образа
        run: |
          if [ -f "backend/services/${{ matrix.service }}/Dockerfile" ]; then
            make image SVC=${{ matrix.service }} TAG=${{ github.sha }}
          else
            echo "у ${{ matrix.service }} нет Dockerfile, пропуск"
          fi
