databaseChangeLog:
  - changeSet:
      id: 002-outbox
      author: backend-dev
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: topic, type: varchar(200), constraints: {nullable: false}}
              - column: {name: aggregate_id, type: uuid, constraints: {nullable: false}}
              - column: {name: workspace_id, type: uuid, constraints: {nullable: false}}
              - column: {name: payload, type: jsonb, constraints: {nullable: false}}
              - column: {name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: sent_at, type: timestamptz}
        - sql:
            sql: CREATE INDEX ix_outbox_unsent ON outbox (created_at) WHERE sent_at IS NULL
      rollback:
        - dropTable:
            tableName: outbox
  - changeSet:
      id: 002-processed-events
      author: backend-dev
      changes:
        - createTable:
            tableName: processed_events
            columns:
              - column: {name: event_id, type: uuid, constraints: {nullable: false}}
              - column: {name: consumer, type: varchar(200), constraints: {nullable: false}}
              - column: {name: processed_at, type: timestamptz, defaultValueComputed: now(), constraints: {nullable: false}}
        - addPrimaryKey:
            tableName: processed_events
            columnNames: event_id, consumer
            constraintName: pk_processed_events
      rollback:
        - dropTable:
            tableName: processed_events
