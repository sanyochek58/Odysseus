server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: workspace-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workspace_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm odysseus, например http://localhost:8180/realms/odysseus. Без значения по умолчанию.
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          # Токен должен быть выписан для API (claim aud). Пустое значение не допускается (SecurityConfig).
          audiences:
            - ${KEYCLOAK_AUDIENCE:odysseus-api}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
